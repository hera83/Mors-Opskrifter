services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Sættes i .env (se .env.example). Standardværdierne efter ":-" svarer til
      # appsettings.json, så en manglende linje i .env ikke overskriver med en tom værdi.
      - Api__SharedKey=${API_SHARED_KEY:-}
      - Ollama__BaseUrl=${OLLAMA_BASE_URL:-http://10.64.50.30:11434/api}
      - Ollama__ApiKey=${OLLAMA_API_KEY:-}
      - Ollama__DefaultChatModel=${OLLAMA_CHAT_MODEL:-gemma4:12b}
      - Ollama__DefaultGenerateModel=${OLLAMA_GENERATE_MODEL:-gemma4:12b}
    volumes:
      - app_dbs:/app/App_dbs
      - app_files:/app/App_files
    restart: unless-stopped

volumes:
  app_dbs:
  app_files:
